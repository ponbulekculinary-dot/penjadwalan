name: Deploy existing Netlify site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate secrets and existing site
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const { NETLIFY_AUTH_TOKEN: token, NETLIFY_SITE_ID: siteId } = process.env;
          if (!token || !siteId) throw new Error('Set repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID before deploying.');
          const response = await fetch(`https://api.netlify.com/api/v1/sites/${encodeURIComponent(siteId)}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) throw new Error(`Cannot access existing Netlify site: HTTP ${response.status}`);
          const site = await response.json();
          if (site.name !== 'phenomenal-banoffee-60d264') throw new Error('NETLIFY_SITE_ID does not identify phenomenal-banoffee-60d264. Deployment stopped.');
          console.log(`Verified existing site: ${site.name}`);
          JS

      - run: npm ci
      - run: npm run build
      - name: Verify publish directory
        run: test -s public/index.html

      - name: Deploy to existing production site
        run: npx --yes netlify-cli@27.19.0 deploy --dir=public --site="$NETLIFY_SITE_ID" --prod --no-build --json > "$RUNNER_TEMP/netlify-deploy.json"

      - name: Verify deployed HTML
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/netlify-deploy.json`, 'utf8'));
          if (!result.deploy_id || !result.deploy_url) throw new Error('Netlify did not return a deployment URL and ID.');
          const expected = readFileSync('public/index.html', 'utf8');
          const response = await fetch(result.deploy_url);
          if (!response.ok || await response.text() !== expected) throw new Error('Deployed HTML does not match the build output. Inspect the Netlify deployment.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Production deployment verified: ${result.deploy_url}\n\nExisting site: https://phenomenal-banoffee-60d264.netlify.app/\n`);
          JS
